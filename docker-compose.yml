version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: libraryhub_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: libraryhub

  redis:
    image: redis:7.0-alpine
    container_name: libraryhub_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  mongodb_data:
  redis_data:
